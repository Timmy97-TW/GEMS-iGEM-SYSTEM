<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEMS iGEM System</title>
<meta name="description" content="The 2027 operating system for the GEMS Taiwan iGEM team: asset streams, registers, roles and timeline.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1d1f'/%3E%3Ccircle cx='11' cy='16' r='3' fill='%23ff9500'/%3E%3Ccircle cx='21' cy='10' r='3' fill='%230071e3'/%3E%3Ccircle cx='21' cy='22' r='3' fill='%2334c759'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="nav" id="nav">
  <div class="nav__in">
    <a class="nav__brand" href="#top">GEMS iGEM System</a>
    <nav class="nav__links">
      <a href="#problems" data-i18n="nav.problems"></a>
      <a href="#audit" data-i18n="nav.audit"></a>
      <a href="#architecture" data-i18n="nav.arch"></a>
      <a href="#depth" data-i18n="nav.depth"></a>
      <a href="#flow" data-i18n="nav.flow"></a>
      <a href="#people" data-i18n="nav.people"></a>
      <a href="#timeline" data-i18n="nav.time"></a>
      <a href="#facts" data-i18n="nav.facts"></a>
      <a href="#standards" data-i18n="nav.std"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="zh">中</button><button data-lang="en">EN</button>
    </div>
  </div>
</header>

<main id="top">

<section class="hero">
  <p class="eyebrow" data-i18n="hero.eyebrow"></p>
  <h1 class="display" data-i18n="hero.title"></h1>
  <p class="lede" data-i18n="hero.sub"></p>
  <div class="stats">
    <div><b>50</b><span data-i18n="stat.people"></span></div>
    <div><b>5</b><span data-i18n="stat.streams"></span></div>
    <div><b>1</b><span data-i18n="stat.registers"></span></div>
    <div><b>12</b><span data-i18n="stat.deadlines"></span></div>
  </div>
  <div class="hero__orbs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</section>

<section class="sec sec--dark" id="problems">
  <div class="wrap">
    <p class="eyebrow" data-i18n="prob.eyebrow"></p>
    <h2 class="headline" data-i18n="prob.title"></h2>
    <p class="lede" data-i18n="prob.sub"></p>
    <ol class="problems" id="problems-list"></ol>
  </div>
</section>

<section class="sec sec--alt" id="audit">
  <div class="wrap">
    <p class="eyebrow" data-i18n="audit.eyebrow"></p>
    <h2 class="headline" data-i18n="audit.title"></h2>
    <p class="lede" data-i18n="audit.sub"></p>
    <div class="astats" id="astats"></div>
    <div class="agrid">
      <div class="acard acard--wide"><h3 data-i18n="audit.photos"></h3><div id="aphotos"></div></div>
      <div class="acard"><h3 data-i18n="audit.size"></h3><div id="asize"></div></div>
      <div class="acard"><h3 data-i18n="audit.hw"></h3><ul class="alist" id="ahw"></ul></div>
      <div class="acard acard--wide"><h3 data-i18n="audit.keep"></h3><ul class="alist alist--ok" id="akeep"></ul></div>
    </div>
  </div>
</section>

<section class="sec" id="architecture">
  <div class="wrap">
    <p class="eyebrow" data-i18n="arch.eyebrow"></p>
    <h2 class="headline" data-i18n="arch.title"></h2>
    <p class="lede" data-i18n="arch.sub"></p>
  </div>
  <div class="wrap wrap--wide">
    <div class="graph" id="graph">
      <svg class="graph__lines" id="graph-lines" aria-hidden="true"></svg>
      <div class="graph__col"><h3 data-i18n="arch.col.streams"></h3><div id="col-streams"></div></div>
      <div class="graph__col"><h3 data-i18n="arch.col.registers"></h3><div id="col-registers"></div></div>
      <div class="graph__col"><h3 data-i18n="arch.col.deliverables"></h3><div id="col-deliverables"></div></div>
    </div>
    <div class="panel" id="graph-panel" aria-live="polite"></div>
  </div>
</section>

<section class="sec sec--alt" id="depth">
  <div class="wrap">
    <p class="eyebrow" data-i18n="depth.eyebrow"></p>
    <h2 class="headline" data-i18n="depth.title"></h2>
    <p class="lede" data-i18n="depth.sub"></p>
    <div class="layers" id="layers"></div>
    <div class="template"><h3 class="drive__h" data-i18n="depth.template"></h3><div class="template__row" id="template"></div></div>
    <div class="states">
      <ol id="states"></ol>
      <p class="note" data-i18n="depth.states"></p>
    </div>
    <div class="drive">
      <h3 class="drive__h" data-i18n="depth.tree"></h3>
      <div class="drive__grid">
        <ul class="tree" id="tree"></ul>
        <div class="panel panel--side" id="tree-panel" aria-live="polite"></div>
      </div>
    </div>
  </div>
</section>

<section class="sec" id="flow">
  <div class="wrap">
    <p class="eyebrow" data-i18n="flow.eyebrow"></p>
    <h2 class="headline" data-i18n="flow.title"></h2>
    <p class="lede" data-i18n="flow.sub"></p>
  </div>
  <div class="wrap wrap--wide">
    <div class="flow__bar">
      <div class="seg" id="flow-tabs" role="tablist"></div>
      <div class="flow__ctl">
        <button id="flow-prev" class="ctl"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
        <button id="flow-play" class="ctl ctl--main"><svg viewBox="0 0 16 16" class="i-play"><path d="M5 3v10l8-5z"/></svg><svg viewBox="0 0 16 16" class="i-pause"><path d="M5 3v10M11 3v10"/></svg></button>
        <button id="flow-next" class="ctl"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
      </div>
    </div>
    <div class="flow">
      <div class="board" id="board">
        <svg class="board__trail" id="board-trail" aria-hidden="true"></svg>
        <div class="board__token" id="token"></div>
      </div>
      <div class="fpanel" id="fpanel" aria-live="polite"></div>
    </div>
  </div>
</section>

<section class="sec sec--alt" id="people">
  <div class="wrap">
    <p class="eyebrow" data-i18n="ppl.eyebrow"></p>
    <h2 class="headline" data-i18n="ppl.title"></h2>
    <p class="lede" data-i18n="ppl.sub"></p>
    <div class="crowd" id="crowd"></div>
    <div class="roles" id="roles"></div>
    <p class="note" data-i18n="ppl.note"></p>
  </div>
</section>

<section class="sec" id="timeline">
  <div class="wrap">
    <p class="eyebrow" data-i18n="time.eyebrow"></p>
    <h2 class="headline" data-i18n="time.title"></h2>
    <p class="lede" data-i18n="time.sub"></p>
  </div>
  <div class="wrap wrap--wide">
    <div class="tl" id="tl"></div>
    <div class="panel" id="tl-panel" aria-live="polite"></div>
  </div>
</section>

<section class="sec sec--dark" id="facts">
  <div class="wrap">
    <p class="eyebrow" data-i18n="facts.eyebrow"></p>
    <h2 class="headline" data-i18n="facts.title"></h2>
    <p class="lede" data-i18n="facts.sub"></p>
    <div class="facttypes" id="facttypes"></div>
    <div class="term">
      <div class="term__bar"><i></i><i></i><i></i><span data-i18n="facts.lint"></span></div>
      <pre id="lint"></pre>
    </div>
  </div>
</section>

<section class="sec" id="standards">
  <div class="wrap">
    <p class="eyebrow" data-i18n="std.eyebrow"></p>
    <h2 class="headline" data-i18n="std.title"></h2>
    <p class="lede" data-i18n="std.sub"></p>
    <div class="stds" id="stds"></div>
  </div>
</section>

</main>

<footer class="foot"><p data-i18n="foot.line"></p></footer>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
